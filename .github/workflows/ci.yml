name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix web
      - run: npm test
      - run: npm run build
      - name: Vérifier qu'aucune donnée sensible n'est suivie
        run: |
          test -z "$(git ls-files 'server/data/**' 'web/dist/**' '*.env')"
          ! git grep -nE 'fleetdash-local-secret-change-me|FLEETDASH_PASSWORD.*1010' -- ':!README.md' ':!.github/workflows/ci.yml'

  smoke:
    name: Installation et démarrage propres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm run install:all
      - run: npm run build
      - name: Smoke test HTTP et arrêt gracieux
        run: |
          export MATRIXAI_DATA_DIR="$RUNNER_TEMP/matrixai-data"
          export MATRIXAI_ADMIN_PASSWORD="a-secure-ci-password"
          npm start > "$RUNNER_TEMP/matrixai.log" 2>&1 &
          PID=$!
          trap 'kill -TERM $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/api/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:3000/api/health | grep '"ok":true'
          curl -fsS http://127.0.0.1:3000/ | grep '<div id="root"></div>'
          curl -fsSI http://127.0.0.1:3000/sw.js | grep -i 'cache-control: no-cache'
          kill -TERM "$PID"
          wait "$PID"
      - name: Audit production critique
        run: npm audit --prefix server --omit=dev --audit-level=critical

  package-safety:
    name: Sécurité du paquet serveur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: server
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          ! grep -E 'data/|\.db|private|\.env' /tmp/pack.json
